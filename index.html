<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Smart Watch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="watch">

    <h2 id="greeting">Good Morning</h2>

    <div class="time" id="time">
        00:00:00
    </div>

    <div class="date" id="date">
        Monday, 1 January 2026
    </div>

    <div class="info">
        <p>Battery: <span id="battery">Loading...</span></p>
        <p>Status: <span id="network">Online</span></p>
    </div>

    <button id="modeBtn">🌙 Dark Mode</button>

</div>

<script src="script.js"></script>
</body>
</html>
